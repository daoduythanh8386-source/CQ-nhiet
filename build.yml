name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with: { name: QC-NhietLuyen-Windows-exe, path: dist/*.exe }
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with: { name: QC-NhietLuyen-Mac-dmg, path: dist/*.dmg }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with: { name: QC-NhietLuyen-Linux-AppImage, path: dist/*.AppImage }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: QC-NhietLuyen-Android-apk, path: android/app/build/outputs/apk/debug/*.apk }
